<!DOCTYPE html>
<html lang="zh-CN" data-theme="obsidian" data-mode="dark" data-navpos="left" data-accent="orange" data-bright="b3" data-motion="full" data-radius="mid" data-typescale="mid" data-noise="0" data-scanline="0" data-grid="0" data-glass="1">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>KFC 媒体中枢 · Media Ops Center</title>
<!-- FOUC 预防：内联先于 CSS 注入全部主题 data 属性（避免白闪/布局跳动） -->
<script>
(function(){try{var p=JSON.parse(localStorage.getItem('v4_pref')||'{}');var d=document.documentElement;
var t=p.theme||'obsidian';var mode=p.mode||'auto';var dm=(mode==='auto')?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):mode;
d.setAttribute('data-theme',t);d.setAttribute('data-mode',dm);d.setAttribute('data-accent',p.accent||'orange');
d.setAttribute('data-bright',p.bright||'b3');d.setAttribute('data-motion',p.motion==='reduced'?'reduced':'full');
d.setAttribute('data-radius',p.radius||'mid');d.setAttribute('data-typescale',p.typescale||'mid');
d.setAttribute('data-noise',p.noise?'1':'0');d.setAttribute('data-scanline',p.scanline?'1':'0');
d.setAttribute('data-grid',p.grid?'1':'0');d.setAttribute('data-glass',p.glass===0?'0':'1');
var navpos=(p.navpos&&p.navpos!=='auto')?p.navpos:({terminal:'top',editorial:'top'}[t]||'left');d.setAttribute('data-navpos',navpos);
var den=p.density==='compact'?.82:p.density==='spacious'?1.15:1;d.style.setProperty('--density',den);
}catch(e){}})();
</script>
<link rel="stylesheet" href="/static/v4/tokens.css"/>
<link rel="stylesheet" href="/static/v4/themes.css"/>
<link rel="stylesheet" href="/static/v4/shell.css"/>
</head>
<body>
<div id="app" class="app">
  <aside id="sidebar" class="sidebar glass" aria-label="主导航"></aside>
  <header class="topbar glass hairline-b">
    <button id="btn-menu" class="tb-btn" title="菜单" aria-label="菜单"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke)" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <div class="brand">
      <div class="brand-t">KFC 媒体中枢</div>
      <div class="brand-s">Media Ops Center · PT·MT·Emby 一站式</div>
    </div>
    <span id="crumb" class="crumb"></span>
    <span id="health-badge" class="ghealth ok" role="status" aria-live="polite">检测中…</span>
    <div class="tb-spacer"></div>
    <span id="global-clock" class="tb-clock mono">------:--:--</span>
    <button id="btn-search" class="tb-btn" title="搜索 / 命令面板 (Ctrl K)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke)" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg> <kbd>Ctrl K</kbd></button>
    <span class="tb-sep"></span>
    <button id="btn-refresh" class="tb-btn" title="刷新"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke)" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v5h-5"/></svg> 刷新</button>
    <button id="btn-log" class="tb-btn" title="活动日志"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke)" stroke-linecap="round"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></button>
    <button id="btn-appearance" class="tb-btn" title="外观（明暗+主题+调色）"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke)" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z"/></svg></button>
    <button id="btn-wallboard" class="tb-btn" title="挂墙大屏模式"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke)" stroke-linecap="round"><rect x="3" y="4" width="18" height="13" rx="1"/><path d="M8 21h8M12 17v4"/></svg></button>
  </header>
  <main id="main" class="main">
    <div class="page-head"><h2 id="pagetitle"></h2></div>
    <div id="page" class="page"></div>
  </main>
  <section id="opresult" class="opresult collapsed glass hairline-t">
    <header class="op-h"><span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="var(--icon-stroke)"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8"/></svg> 操作结果 <b id="opcount" class="mono">0</b></span>
      <span class="op-tools"><button id="btn-clear" class="btn sm">清空</button><button id="opcollapse" class="btn sm" onclick="document.getElementById('opresult').classList.toggle('collapsed')">收起</button></span></header>
    <div id="oprows" class="op-rows"><div class="op-empty">暂无结果</div></div>
  </section>
</div>
<div id="palette" class="palette" role="dialog" aria-modal="true">
  <div class="pal-box glass"><input id="pal-cmd" class="pal-cmd" placeholder="搜索日志 / 跳转模块 / 切换主题 / 保存布局…"/><div id="pal-results" class="pal-results"></div></div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/static/v4/app.js"></script>
</body>
</html>
