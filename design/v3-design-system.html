<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KFC Media Hub · V3 Design System</title>
<style>
/* ═══════════ Design Tokens（唯一真源，全站必须引用，禁止页面自定义颜色） ═══════════ */
:root{
  /* 颜色 */
  --primary:#7ed957; --primary-strong:#52b54b; --secondary:#8b5cf6;
  --bg:#0b0e14; --bg-elevated:#11151f; --surface:#151a26;
  --glass-bg:rgba(28,34,48,.55); --glass-blur:24px; --glass-opacity:.55;
  --glass-border:rgba(255,255,255,.13); --glass-hi:rgba(255,255,255,.22);
  --glass-shadow:0 18px 50px -12px rgba(0,0,0,.6);
  --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16);
  --text:#e8edf6; --text-2:#9aa7bd; --text-3:#6b7891;
  --success:#4ade80; --warning:#fbbf24; --error:#f87171; --info:#60a5fa;
  --success-bg:rgba(74,222,128,.13); --warning-bg:rgba(251,191,36,.13);
  --error-bg:rgba(248,113,113,.13); --info-bg:rgba(96,165,250,.13);
  /* 布局 */
  --sidebar-w:236px; --header-h:64px; --content-max:1440px;
  --card-r:16px; --btn-r:10px; --input-r:10px; --grid-gap:16px; --section:28px;
  /* 组件 */
  --btn-h:36px; --input-h:38px; --badge-r:999px; --shadow-1:0 4px 16px -6px rgba(0,0,0,.5);
  --ease:cubic-bezier(.22,.8,.28,1); --dur:.24s;
}
[data-theme="light"]{
  --bg:#eef1f7; --bg-elevated:#fff; --surface:#fff;
  --glass-bg:rgba(255,255,255,.62); --glass-border:rgba(255,255,255,.75);
  --glass-hi:rgba(255,255,255,.95); --glass-shadow:0 18px 50px -16px rgba(30,40,70,.22);
  --border:rgba(30,40,70,.10); --border-strong:rgba(30,40,70,.18);
  --text:#121826; --text-2:#4d5a72; --text-3:#8290a8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);-webkit-font-smoothing:antialiased}
/* 环境光背景（多层柔和光晕，非霓虹渐变） */
.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.24}
.ambient i:nth-child(1){width:460px;height:460px;background:var(--primary);top:-160px;left:20%}
.ambient i:nth-child(2){width:520px;height:520px;background:var(--secondary);bottom:-200px;right:-100px;opacity:.18}
.ambient i:nth-child(3){width:320px;height:320px;background:var(--info);top:40%;left:60%;opacity:.1}
/* ═══════════ Liquid Glass 材质（真实多层：背景模糊+边缘高光+内阴影+外阴影） ═══════════ */
.glass{
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.5);
  backdrop-filter:blur(var(--glass-blur)) saturate(1.5);
  border:1px solid var(--glass-border);
  border-radius:var(--card-r);
  box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(0,0,0,.12);
  position:relative;
}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,var(--glass-hi),transparent 30%,transparent 70%,rgba(255,255,255,.04));opacity:.5}
/* 布局 */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex-shrink:0;padding:18px 12px;display:flex;flex-direction:column;gap:6px;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 20px;font-weight:800;font-size:15px;letter-spacing:.2px}
.brand .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--primary),var(--primary-strong));color:#0b0e14;font-size:17px;
  box-shadow:0 4px 14px -4px var(--primary)}
.brand small{display:block;font-size:9px;color:var(--text-3);font-weight:600;letter-spacing:.5px}
.nav-group{font-size:10px;color:var(--text-3);letter-spacing:1.4px;text-transform:uppercase;padding:14px 12px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--btn-r);
  color:var(--text-2);cursor:pointer;transition:all var(--dur) var(--ease);font-size:13px;font-weight:600;
  border:1px solid transparent;user-select:none}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--text);transform:translateX(2px)}
.nav-item.active{background:linear-gradient(90deg,rgba(126,217,87,.18),rgba(126,217,87,.04));
  color:var(--primary);border-color:rgba(126,217,87,.22);box-shadow:inset 2px 0 0 var(--primary)}
.nav-item .ic{width:20px;text-align:center;font-size:15px}
.nav-item .cnt{margin-left:auto;font-size:10px;padding:1px 7px;border-radius:var(--badge-r);background:rgba(255,255,255,.08);color:var(--text-3)}
.main{flex:1;min-width:0;padding:0 26px 40px;max-width:var(--content-max);margin:0 auto;width:100%}
.topbar{height:var(--header-h);display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;
  margin:0 -26px 22px;padding:0 26px;border-radius:0 0 var(--card-r) var(--card-r)}
.topbar h1{font-size:19px;font-weight:800;letter-spacing:-.3px}
.topbar .sp{flex:1}
.search{height:36px;min-width:220px;max-width:320px;display:flex;align-items:center;gap:8px;padding:0 12px;
  border-radius:var(--btn-r);border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text-3);font-size:12px}
.search input{border:0;background:transparent;color:var(--text);outline:0;flex:1;font-size:12px}
.search kbd{font-size:10px;padding:2px 6px;border:1px solid var(--border);border-radius:5px;color:var(--text-3)}
.clock{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:var(--btn-r);
  border:1px solid rgba(126,217,87,.28);background:linear-gradient(135deg,rgba(126,217,87,.12),rgba(139,92,246,.06));font-size:11px;font-weight:700}
.clock .t{font-variant-numeric:tabular-nums;font-size:13px;color:var(--text)}
.icon-btn{width:36px;height:36px;border-radius:var(--btn-r);border:1px solid var(--border);background:rgba(255,255,255,.04);
  color:var(--text-2);cursor:pointer;display:grid;place-items:center;font-size:15px;transition:all var(--dur)}
.icon-btn:hover{background:rgba(255,255,255,.1);color:var(--text);transform:translateY(-1px)}
/* 组件 */
.card{padding:20px;margin-bottom:var(--grid-gap)}
.card h2{font-size:15px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card h3{font-size:13px;font-weight:800;margin-bottom:12px}
.sub{color:var(--text-2);font-size:12px}
.muted{color:var(--text-3);font-size:11px}
h2.sec{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--text-3);margin:var(--section) 0 12px;font-weight:800}
.grid{display:grid;gap:var(--grid-gap)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{height:var(--btn-h);padding:0 15px;border-radius:var(--btn-r);border:1px solid var(--border-strong);
  background:rgba(255,255,255,.05);color:var(--text);font-size:12.5px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;justify-content:center;transition:all var(--dur) var(--ease);font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-1);border-color:var(--border-strong)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-strong));color:#0b0e14;border-color:transparent;
  box-shadow:0 6px 18px -8px var(--primary)}
.btn.ghost{background:transparent}.btn.sm{height:30px;padding:0 11px;font-size:11px}
.btn.danger{color:var(--error);border-color:rgba(248,113,113,.3)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--badge-r);font-size:10.5px;font-weight:800;
  border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text-2)}
.tag.ok{color:var(--success);background:var(--success-bg);border-color:rgba(74,222,128,.3)}
.tag.warn{color:var(--warning);background:var(--warning-bg);border-color:rgba(251,191,36,.3)}
.tag.err{color:var(--error);background:var(--error-bg);border-color:rgba(248,113,113,.3)}
.tag.info{color:var(--info);background:var(--info-bg);border-color:rgba(96,165,250,.3)}
/* KPI */
.kpi{padding:18px;display:flex;flex-direction:column;gap:6px;transition:transform var(--dur) var(--ease)}
.kpi:hover{transform:translateY(-3px)}
.kpi .lb{font-size:11px;color:var(--text-2);font-weight:700;letter-spacing:.4px;display:flex;align-items:center;gap:6px}
.kpi .vl{font-size:28px;font-weight:900;letter-spacing:-1px;line-height:1.1}
.kpi .dt{font-size:10.5px;color:var(--text-3)}
.kpi .mini{height:4px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:4px}
.kpi .mini i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--primary),var(--primary-strong))}
/* 输入 */
.input,.select{height:var(--input-h);padding:0 12px;border-radius:var(--input-r);border:1px solid var(--border);
  background:rgba(255,255,255,.04);color:var(--text);font-size:12.5px;outline:0;font-family:inherit;width:100%;
  transition:border-color var(--dur)}
.input:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(126,217,87,.1)}
.switch{width:40px;height:22px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid var(--border);
  position:relative;cursor:pointer;transition:background var(--dur);flex-shrink:0}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text-2);transition:all var(--dur) var(--ease)}
.switch.on{background:var(--primary)}
.switch.on::after{left:20px;background:#0b0e14}
/* 表格 */
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:9px 10px;color:var(--text-3);font-size:10px;letter-spacing:.8px;text-transform:uppercase;font-weight:700;border-bottom:1px solid var(--border)}
td{padding:10px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text-2)}
tr:hover td{background:rgba(255,255,255,.03)}
tr:last-child td{border-bottom:0}
/* Tabs */
.tabs{display:flex;gap:6px;padding:4px;border-radius:var(--btn-r);background:rgba(255,255,255,.04);border:1px solid var(--border);width:fit-content;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:7px;color:var(--text-2);font-size:12px;font-weight:700;cursor:pointer;transition:all var(--dur);border:0;background:transparent;font-family:inherit}
.tab:hover{color:var(--text)}.tab.active{background:var(--glass-bg);color:var(--text);box-shadow:var(--shadow-1);border:1px solid var(--glass-border)}
/* 进度环 */
.ring{width:96px;height:96px;position:relative;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:21px;font-weight:900}
/* 条形图 */
.bar-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:11px}
.bar-row .lb{width:80px;color:var(--text-2);font-weight:600}
.bar-row .track{flex:1;height:7px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
.bar-row .track i{display:block;height:100%;border-radius:6px;transition:width .9s var(--ease)}
.bar-row .vl{width:36px;text-align:right;color:var(--text-3);font-weight:700}
/* 列表项 */
.row-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;border:1px solid var(--border);
  background:rgba(255,255,255,.025);margin:7px 0;transition:all var(--dur) var(--ease)}
.row-item:hover{border-color:rgba(126,217,87,.35);transform:translateY(-2px);box-shadow:var(--shadow-1)}
.avatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex-shrink:0;
  background:linear-gradient(135deg,rgba(126,217,87,.2),rgba(139,92,246,.2));border:1px solid var(--glass-border)}
/* Toast / Modal */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 16px;border-radius:12px;z-index:100;
  font-size:12px;font-weight:700;animation:slideUp .3s var(--ease)}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.anim{animation:fadeIn .4s var(--ease) both}
/* 响应式 */
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){
  .sidebar{position:fixed;left:-260px;top:0;z-index:50;background:var(--bg-elevated);transition:left var(--dur)}
  .sidebar.open{left:0}
  .main{padding:0 14px 30px}.topbar{margin:0 -14px 16px;padding:0 12px;gap:8px}
  /* ★ 实测修复：手机窄屏标题被挤成竖排、时钟日期折行 → 标题不换行 + 隐藏日期/通知/头像 */
  .topbar h1{white-space:nowrap;flex-shrink:0;font-size:15px}
  .clock .cd-d{display:none}      /* 手机只显示时间，不显示年月日 */
  .clock{padding:5px 8px;flex-shrink:0}
  .clock .t{font-size:11px}
  .topbar .icon-btn[title="通知"],.topbar .avatar{display:none}
  .g2,.g3,.g4{grid-template-columns:1fr}.search{display:none}
  .menu-btn{display:grid!important}
}
.menu-btn{display:none}
</style>
</head>
<body>
<div class="ambient"><i></i><i></i><i></i></div>
<div class="app">
  <!-- ══════════ 侧栏：一级导航按信息架构分组 ══════════ -->
  <aside class="sidebar glass" id="sidebar">
    <div class="brand"><div class="logo">▶</div><div>KFC Media Hub<small>V3.0 · PLATFORM</small></div></div>
    <div id="navHost"></div>
    <div style="margin-top:auto;padding:12px" class="muted">本地实例 · v3.0.0<br>插件生态 / 服务注册 / 事件驱动</div>
  </aside>

  <div class="main">
    <!-- ══════════ 顶栏 ══════════ -->
    <header class="topbar glass">
      <button class="icon-btn menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <h1 id="pageTitle">工作台</h1>
      <div class="search"><span>🔍</span><input placeholder="搜索功能 / 影片 / 实例…"><kbd>⌘K</kbd></div>
      <span class="sp"></span>
      <div class="clock"><span id="clockDate"></span><span class="t" id="clockTime"></span></div>
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题">🌙</button>
      <button class="icon-btn" title="通知">🔔</button>
      <div class="avatar" style="width:34px;height:34px">👤</div>
    </header>

    <div id="view"></div>
  </div>
</div>

<script>
/* ══════════ 信息架构：8 个一级分组（导航可折叠/搜索/收藏/自定义排序，插件动态注入） ══════════ */
const NAV=[
  {id:'workbench',name:'工作台',ic:'◈',items:[['overview','综合总览'],['realtime','实时动态'],['health','服务健康']]},
  {id:'services',name:'服务中心',ic:'🔌',items:[['instances','服务实例'],['media-servers','媒体服务器'],['netdisk','网盘服务'],['bots','消息机器人'],['ai','AI 服务']]},
  {id:'media',name:'媒体运营',ic:'🎬',items:[['watching','实时观看'],['stats','播放统计'],['rank','媒体排行榜'],['users','用户管理']]},
  {id:'bot',name:'机器人中心',ic:'🤖',items:[['bot-list','机器人列表'],['bot-route','消息路由'],['bot-ai','AI 管理'],['bot-game','游戏管理']]},
  {id:'auto',name:'自动化中心',ic:'⚙️',items:[['tasks','任务管理'],['cron','定时任务'],['rules','自动化规则'],['webhook','Webhook'],['events','事件管理']]},
  {id:'plugins',name:'插件中心',ic:'🧩',items:[['market','插件市场'],['installed','已安装插件'],['sdk','插件开发'],['perm','插件权限']]},
  {id:'data',name:'数据中心',ic:'📊',items:[['dash','数据统计'],['agg','数据聚合'],['history','历史记录'],['export','数据导出']]},
  {id:'system',name:'系统管理',ic:'🛡️',items:[['accounts','用户管理'],['roles','角色权限'],['api','API 管理'],['logs','日志中心'],['monitor','监控中心'],['backup','备份恢复'],['settings','系统设置']]},
];

const ICON={overview:'◈',realtime:'📡',health:'💚',instances:'🔌','media-servers':'📺',netdisk:'☁️',bots:'🤖',ai:'🧠',
  watching:'👁',stats:'📈',rank:'🏆',users:'👥','bot-list':'🤖','bot-route':'🔀','bot-ai':'🧠','bot-game':'🎮',
  tasks:'⚙️',cron:'⏰',rules:'📐',webhook:'🔗',events:'📡',market:'🛒',installed:'🧩',sdk:'🛠️',perm:'🔐',
  dash:'📊',agg:'🔄',history:'🕘',export:'📤',accounts:'👤',roles:'🔑',api:'🔌',logs:'📜',monitor:'📹',backup:'💾',settings:'⚙️'};
const NAME={};NAV.forEach(g=>g.items.forEach(([k,v])=>NAME[k]=v));

let CUR='overview';
function buildNav(){
  const h=document.getElementById('navHost');
  h.innerHTML=NAV.map((g,i)=>`
    <div class="nav-group" style="cursor:pointer" onclick="toggleGrp(${i})">${g.name} <span style="float:right">▾</span></div>
    <div id="grp${i}">${g.items.map(([k,v])=>`
      <div class="nav-item ${CUR===k?'active':''}" data-k="${k}" onclick="go('${k}')">
        <span class="ic">${ICON[k]||'•'}</span>${v}<span class="cnt">${k==='events'?'3':k==='tasks'?'5':k==='instances'?'6':''}</span>
      </div>`).join('')}</div>`).join('');
}
function toggleGrp(i){const e=document.getElementById('grp'+i);e.style.display=e.style.display==='none'?'':'none'}
function go(k){CUR=k;document.querySelectorAll('.nav-item').forEach(e=>e.classList.toggle('active',e.dataset.k===k));
  document.getElementById('pageTitle').textContent=NAME[k]||k;render();document.getElementById('sidebar').classList.remove('open')}
function toggleTheme(){const b=document.body;const light=b.dataset.theme==='light';
  b.dataset.theme=light?'':'light';document.getElementById('themeBtn').textContent=light?'🌙':'☀️'}

/* ══════════ 仪表盘组件注册表（插件可动态贡献；总览不写死） ══════════ */
const WIDGETS=[
  {id:'status',title:'系统整体状态',span:2,render:()=>statusCard()},
  {id:'kpi',title:'关键业务数据',span:2,render:()=>kpiGrid()},
  {id:'realtime',title:'实时动态',span:1,render:()=>realtimeCard()},
  {id:'instances',title:'服务实例',span:1,render:()=>instancesCard()},
  {id:'tasks',title:'近期任务',span:1,render:()=>tasksCard()},
  {id:'anomaly',title:'最近异常',span:1,render:()=>anomalyCard()},
];

function render(){
  const v=document.getElementById('view');
  if(CUR==='overview'){
    v.innerHTML=`<div class="glass card anim" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <h2>◈ 控制驾驶舱</h2><span class="sub">数据来自真实后端 · 组件由注册表动态生成 · 支持拖拽排序/隐藏/插件贡献</span>
        <span style="flex:1"></span>
        <button class="btn sm" onclick="toast('已保存布局（演示）','ok')">✏️ 自定义布局</button>
        <button class="btn sm" onclick="toast('组件库：6 个内置 + N 个插件组件','info')">➕ 添加组件</button>
      </div>
      <div class="grid g2">${WIDGETS.map(w=>`<div class="${w.span===2?'':'glass card'} anim" style="${w.span===2?'grid-column:1/-1':''}">${w.render()}</div>`).join('')}</div>`;
  } else if(CUR==='market'||CUR==='installed'||CUR==='sdk'||CUR==='perm'){
    v.innerHTML=pluginsPage();
  } else if(CUR==='instances'||CUR==='media-servers'||CUR==='netdisk'||CUR==='bots'||CUR==='ai'){
    v.innerHTML=servicesPage();
  } else {
    v.innerHTML=genericPage();
  }
}

function statusCard(){return `<div class="glass card" style="margin:0">

function toast(msg,kind){const t=document.createElement('div');t.className='toast glass';
  t.style.borderColor=kind==='ok'?'rgba(74,222,128,.4)':kind==='err'?'rgba(248,113,113,.4)':'var(--glass-border)';
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* 顶栏时钟（中文长格式 + 增量更新不闪） */
function clock(){const d=new Date(),p=n=>String(n).padStart(2,'0');
  const wd=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  document.getElementById('clockDate').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · '+wd;
  document.getElementById('clockTime').textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}
setInterval(clock,1000);clock();
