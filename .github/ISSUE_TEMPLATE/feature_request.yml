name: "✨ 功能建议"
description: 新增能力、新增服务实例类型、体验改进
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 目标方向
      options:
        - 多实例 / 服务注册表
        - 面板 UI / 交互
        - 播放与媒体库
        - PT 与整理链路
        - 机器人与通知
        - 部署与运维
        - 文档与示例
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 若涉及新增配置，请说明是否需要向后兼容、是否影响已有凭据
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
